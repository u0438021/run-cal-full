steps:
  - name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        cd apps/web
        pnpm install --frozen-lockfile
        pnpm build
  - name: node:20
    entrypoint: bash
    args:
      - -c
      - npx --yes firebase-tools@latest deploy --only hosting --project run-cal-th --non-interactive
options:
  logging: CLOUD_LOGGING_ONLY
