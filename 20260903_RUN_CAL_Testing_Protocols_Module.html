<!DOCTYPE html>

<title>Testing Protocols — Standalone Module</title>
<!--
  ============================================================================
  RUN | CAL — Testing Protocols, extracted as a standalone module
  ============================================================================
  Extracted 2026-09-03 from RUN | CAL (public/index.html) so this feature can
  be dropped into a different app. Contains ONLY the calculator/testing-
  protocol feature:
    - 6 Lactate Threshold Pace/HR protocols (Critical Pace, RAMP, 30-Minute
      Run, 5K Run, LTHR 5K, LTHR 30-Minute) — formulas + zone tables.
    - Hydration Protocol (sweat-rate test, hydration/electrolyte/carb
      targets, race-day protocol, in-session Test History).

  Deliberately NOT included (by explicit request — "just the protocols",
  not the full save/history system):
    - No Firebase / Firestore / Auth / multi-user athlete system.
    - No persistence to any backend or localStorage. The Hydration Protocol's
      "Save Test to History" button still works, but only keeps tests in an
      in-memory array (S.hydrationTests) that resets on page reload — wire
      it to your host app's own storage (see saveHydrationTestLocal below)
      if you want it to persist.
    - No login/menu/topbar chrome — replaced with simple nav tabs so this
      file runs standalone; drop the ROUTES/render()/App object into your
      own app's shell instead of using this file's tabs, if you already have
      a shell.

  Formulas & test procedures are sourced from (do not change without
  re-checking the source):
    - LT Pace (4 protocols): https://www.aixsurge.com/blog/calculate-lactate-threshold
    - LTHR (2 protocols): https://www.aixsurge.com/blog/calculate-threshold-heart-rate
  Hydration Protocol formulas were built for RUN | CAL directly (sweat rate =
  weight loss + fluid in − urine out, over duration).

  Architecture (same pattern as RUN | CAL, so it merges in easily):
    - `S` is one global state object.
    - `ROUTES` maps a screen name to a template-literal-returning function.
    - `render()` re-renders the whole #app container on every state change
      (no virtual DOM) — this is why inputs only commit on change/blur-style
      handlers rather than recalculating on every keystroke: a full re-render
      on every keystroke would fight input focus.
    - `window.App` holds every handler referenced by inline onclick/oninput.
  ============================================================================
-->
<style>

</head>
<body>
<div id="app"></div>

<script type="module">
/* ---------------------------------------------------------
   1) State
   --------------------------------------------------------- */
const S = {
  screen: 'protocol-cp',
  protocolForm: {},
  protocolCalculated: false,
  hydrationForm: newHydrationForm(),
  hydrationCalculated: false,
  hydrationError: '',
  hydrationHowToOpen: false,
  hydrationTests: [] // in-memory only — see header comment on persistence
};

/* ---------------------------------------------------------
   2) Calculation engine — LTPACE & LTHR
   (verbatim from RUN | CAL — do not change without re-checking
   https://www.aixsurge.com/blog/calculate-lactate-threshold and
   https://www.aixsurge.com/blog/calculate-threshold-heart-rate)
   --------------------------------------------------------- */
const Calc = {
  paceZones: [
    {label:"Zone 1", name:"Recovery", lo:0.65, hi:0.78},
    {label:"Zone 2", name:"Endurance", lo:0.78, hi:0.88},
    {label:"Zone 3", name:"Tempo", lo:0.88, hi:0.94},
    {label:"Zone 4", name:"Threshold", lo:0.95, hi:1.03},
    {label:"Zone 5", name:"Anaerobic / VO2max", lo:1.04, hi:1.40}
  ],
  hrZones: [
    {label:"Zone 1", name:"Recovery", lo:0.0, hi:0.85},
    {label:"Zone 2", name:"Endurance", lo:0.85, hi:0.89},
    {label:"Zone 3", name:"Tempo", lo:0.90, hi:0.94},
    {label:"Zone 4", name:"Threshold", lo:0.95, hi:1.02},
    {label:"Zone 5", name:"Anaerobic / VO2max", lo:1.03, hi:1.40}
  ],
  // ---- LT Pace protocols (speed in m/s throughout) ----
  criticalPace(v1,t1,v2,t2){
    const cp = (v2*t2 - v1*t1) / (t2 - t1);
    return cp * (1 - 0.06); // subtract 6%
  },
  rampTest(vCompleteKmh, incompleteSec, stageSec){
    const inc = 1; // km/h per stage
    const peakKmh = vCompleteKmh + (inc * (incompleteSec/stageSec));
    const peakMs = peakKmh / 3.6;
    return peakMs * (1 - 0.176); // subtract 17.6%
  },
  thirtyMinPace(distanceM){
    return distanceM / (30*60); // m/s, direct — no adjustment
  },
  fiveKPace(timeSec){
    const speed = 5000/timeSec; // m/s
    return speed * (1 - 0.10); // subtract 10%
  },
  paceZoneTable(ltSpeedMs){
    if(!ltSpeedMs || !isFinite(ltSpeedMs)) return [];
    return this.paceZones.map(z=>({...z, loSpeed: ltSpeedMs*z.lo, hiSpeed: ltSpeedMs*z.hi}));
  },
  // ---- LTHR protocols (bpm) ----
  lthrFiveK(avgHr){ return avgHr / 1.04; },
  lthrThirtyMin(avgHr10to30){ return avgHr10to30; },
  hrZoneTable(lthr){
    if(!lthr || !isFinite(lthr)) return [];
    return this.hrZones.map(z=>({...z, lo:Math.round(lthr*z.lo), hi: z.hi>=1.4? null : Math.round(lthr*z.hi)}));
  }
};

/* ---------------------------------------------------------
   3) Utilities
   --------------------------------------------------------- */
function msToPace(ms){ // m/s -> "mm:ss /km"
  if(!ms || !isFinite(ms) || ms<=0) return "—";
  const secPerKm = 1000/ms;
  const m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
  return `${m}:${String(s).padStart(2,'0')} /km`;
}
function parseTimeToSec(v){
  if(!v) return null;
  if(String(v).includes(':')){
    const p = String(v).split(':').map(Number);
    if(p.some(isNaN)) return null;
    if(p.length===3) return p[0]*3600+p[1]*60+p[2];
    if(p.length===2) return p[0]*60+p[1];
    return p[0];
  }
  const n = parseFloat(v); return isFinite(n)? n : null;
}
function paceStrToKmh(v){ // "5:30" (min:sec per km) -> km/h
  if(!v) return null;
  const parts = String(v).split(':').map(Number);
  if(parts.some(isNaN)) return null;
  let minPerKm;
  if(parts.length===2) minPerKm = parts[0] + parts[1]/60;
  else if(parts.length===1) minPerKm = parts[0];
  else return null;
  if(minPerKm<=0) return null;
  return 60/minPerKm;
}
function kmhToPaceStr(kmh){ // km/h -> "mm:ss"
  if(!kmh || !isFinite(kmh) || kmh<=0) return '';
  const minPerKm = 60/kmh;
  const m = Math.floor(minPerKm), s = Math.round((minPerKm-m)*60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function num(v){ const n=parseFloat(v); return isFinite(n)? n : null; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid8(){ return Math.random().toString(36).slice(2,10); }

/* ---------------------------------------------------------
   4) Hydration Protocol — form + formula
   --------------------------------------------------------- */
function newHydrationForm(){
  return {
    testDate: todayStr(), sport:'', profileLabel:'',
    duration:'', preWeight:'', postWeight:'', fluidConsumed:'', urine:'',
    temperature:'', humidity:'', intensity:'Moderate', notes:'',
    targetPct: 75, sweatSodiumConc:'', sodiumTargetManual:'', carbTarget:'',
    raceDurationHr:'', bottleCapacityMl:''
  };
}
function computeHydration(f){
  const pre = num(f.preWeight), post = num(f.postWeight);
  const durationMin = num(f.duration);
  const fluidMl = num(f.fluidConsumed)||0, urineMl = num(f.urine)||0;
  const weightChangeKg = (pre!=null && post!=null) ? (pre-post) : null;
  const weightChangePct = (pre!=null && pre>0 && weightChangeKg!=null) ? (weightChangeKg/pre*100) : null;
  const sweatLossL = (weightChangeKg!=null) ? weightChangeKg + fluidMl/1000 - urineMl/1000 : null;
  const durationHr = durationMin? durationMin/60 : null;
  const sweatRateLHr = (sweatLossL!=null && durationHr) ? sweatLossL/durationHr : null;
  const sweatRateMlHr = sweatRateLHr!=null ? sweatRateLHr*1000 : null;
  const targetPct = num(f.targetPct)!=null? num(f.targetPct) : 75;
  const fluidTargetMlHr = sweatRateMlHr!=null ? sweatRateMlHr * (targetPct/100) : null;
  const sweatSodiumConc = num(f.sweatSodiumConc);
  const sodiumLossMgHr = (sweatRateLHr!=null && sweatSodiumConc!=null) ? sweatRateLHr * sweatSodiumConc : null;
  const raceDurationHr = num(f.raceDurationHr);
  const bottleCapacityMl = num(f.bottleCapacityMl);
  const totalFluidMl = (fluidTargetMlHr!=null && raceDurationHr) ? fluidTargetMlHr * raceDurationHr : null;
  const bottlesNeeded = (totalFluidMl!=null && bottleCapacityMl) ? Math.ceil(totalFluidMl/bottleCapacityMl) : null;
  return {
    weightChangeKg, weightChangePct, sweatLossL, sweatRateLHr, sweatRateMlHr, targetPct,
    fluidTargetMlHr, sweatSodiumConc, sodiumLossMgHr,
    raceDurationHr, bottleCapacityMl, totalFluidMl, bottlesNeeded
  };
}
function perInterval(hourlyVal, divisor){ return hourlyVal!=null ? hourlyVal/divisor : null; }
function hydrationWarnings(f, c){
  const warns = [];
  const pre = num(f.preWeight), post = num(f.postWeight), durationMin = num(f.duration);
  const fluidL = (num(f.fluidConsumed)||0)/1000;
  if(pre!=null && post!=null && post > pre){
    warns.push("Post-exercise weight is higher than pre-exercise weight — double-check the scale readings. Review this result and consider repeating the test under controlled conditions.");
  }
  if(c.weightChangePct!=null && c.weightChangePct > 3){
    warns.push("Body weight change is notably high for a single session. Review this result and consider repeating the test under controlled conditions.");
  }
  if(c.sweatLossL!=null && fluidL > c.sweatLossL){
    warns.push("Fluid consumed during the test exceeded the estimated sweat loss, which can make this sweat rate estimate less reliable.");
  }
  if(durationMin!=null && durationMin > 0 && durationMin < 30){
    warns.push("Test duration was fairly short — sessions of 45–60+ minutes tend to give more consistent sweat rate estimates.");
  }
  return warns;
}
// Persistence hook: wire this to your host app's own storage (Firestore,
// localStorage, a REST call, ...) — it currently only keeps tests for the
// life of the page. Everything above/below this function is storage-agnostic.
function saveHydrationTestLocal(f, c){
  S.hydrationTests.push({
    id: uid8(), testDate:f.testDate, sport:f.sport, profileLabel:f.profileLabel,
    duration:num(f.duration), temperature:num(f.temperature), humidity:num(f.humidity),
    sweatRate:c.sweatRateMlHr, weightChangePercent:c.weightChangePct,
    sodiumTarget: f.sodiumTargetManual!==''? num(f.sodiumTargetManual) : (c.sodiumLossMgHr!=null? Math.round(c.sodiumLossMgHr): null),
    isActiveProfile:false
  });
}

/* ---------------------------------------------------------
   5) Shared UI helpers
   --------------------------------------------------------- */
function sourceFooter(){
  return `<div class="source-footer">Formulas &amp; protocols: aixsurge.com/blog<br>Lactate Threshold Pace &amp; Heart Rate for Running</div>`;
}
function glossary(keys){
  const defs = {
    ms: `<b>m/s</b> — meters per second (m = meters, s = seconds)`,
    m: `<b>m</b> — meters`,
    kmh: `<b>km/h</b> — kilometers per hour`,
    minkm: `<b>min/km</b> — minutes per kilometer (running pace)`,
    bpm: `<b>bpm</b> — beats per minute (heart rate)`,
    sec: `<b>sec</b> — seconds`,
    min: `<b>min</b> — minutes`
  };
  const rows = keys.map(k=>`<div class="g-row" style="margin-top:4px;">${defs[k]}</div>`).join('');
  return `<div class="glossary-card"><div class="g-title">Units on this page</div>${rows}</div>`;
}
function procedure(steps){
  return `<div class="proc-card">
    <div class="proc-title">Protocol</div>
    ${steps}
    <div class="proc-note">* Please check with your coach's training schedule again.</div>
  </div>`;
}
function resultBlock(label, bigValue, zones, kind){
  const zoneCards = zones.map(z=>`
    <div class="zone-card">
      <div><div class="z-name">${z.label} · ${z.name}</div></div>
      <div class="z-val">${kind==='pace'? `${msToPace(z.loSpeed)} – ${msToPace(z.hiSpeed)}` : (z.hi? `${z.lo}–${z.hi} bpm` : `>${z.lo} bpm`)}</div>
    </div>`).join('');
  return `
    <div class="result-card">
      <div class="unit">${label}</div>
      <div class="big">${bigValue}</div>
    </div>
    <div class="section-label">Training Zones</div>
    ${zoneCards}`;
}
const TABS = [
  {id:'protocol-cp', label:'Critical Pace'},
  {id:'protocol-ramp', label:'RAMP'},
  {id:'protocol-30pace', label:'30-Min Run'},
  {id:'protocol-5kpace', label:'5K Run'},
  {id:'protocol-5khr', label:'LTHR 5K'},
  {id:'protocol-30hr', label:'LTHR 30-Min'},
  {id:'protocol-hydration', label:'Hydration'}
];
function shell(title, subtitle, procHtml, glossaryHtml, bodyHtml, resultHtml){
  return `
  <div class="brandbar">
    <div class="brand">RUN <span>|</span> CAL</div>
    <div class="nav-tabs">
      ${TABS.map(t=>`<button class="${S.screen===t.id?'active':''}" onclick="App.go('${t.id}')">${t.label}</button>`).join('')}
    </div>
  </div>
  <div class="container">
    <div class="page-head"><h1>${title}</h1><p>${subtitle}</p></div>
    <div class="two-col">
      <div>
        ${procHtml}
        <div class="card">${bodyHtml}</div>
        ${resultHtml}
      </div>
      <div class="side">
        ${glossaryHtml}
      </div>
    </div>
    <div class="detail-bottom">
      <button class="btn-outline" onclick="App.resetProtocol()">Reset</button>
      <button class="btn-solid" onclick="App.calcProtocol()">Calculate</button>
    </div>
  </div>${sourceFooter()}`;
}

/* ---------------------------------------------------------
   6) The 6 LT Pace / LTHR protocol screens
   --------------------------------------------------------- */
function screenProtocolCP(){
  const f = S.protocolForm;
  let result='';
  if(S.protocolCalculated){
    const haveAll = f.dist1 && f.time1 && f.dist2 && f.time2;
    if(haveAll){
      const v1 = f.dist1 / f.time1, v2 = f.dist2 / f.time2;
      if(f.time1 === f.time2){
        result = `<div class="field-error" style="margin-top:14px;">Effort 1 and Effort 2 must have different times — enter the actual time (seconds) for each effort.</div>`;
      } else {
        const ltMs = Calc.criticalPace(v1,f.time1,v2,f.time2);
        result = resultBlock('LT Pace', msToPace(ltMs), Calc.paceZoneTable(ltMs), 'pace');
      }
    } else {
      result = `<div class="field-error" style="margin-top:14px;">Please enter the distance and time for both Effort 1 and Effort 2, then press Calculate again.</div>`;
    }
  }
  const proc = procedure(`
    <p><b>Warm-up:</b> Perform a warm up. For example: 10 easy minutes with some short accelerations.</p>
    <ol>
      <li>3–5 minutes as fast as you can (max effort at steady pace)</li>
      <li>At least 15 minutes of recovery, or the next day</li>
      <li>12–20 minutes as fast as you can (max effort at steady pace)</li>
    </ol>
    <p><b>Cool-down:</b> For example, 10 minutes easy.</p>`);
  const body = `
    <div class="field-hint" style="font-size:12.5px;">Enter the distance covered (meters) and the time taken (seconds) for each of the two efforts above — the app works out the mean speed for you.</div>
    <div class="section-label" style="margin-top:20px;">Effort 1 (short, 3–5 min)</div>
    <div class="row2">
      <div class="field" style="margin-top:0;"><div class="field-label">Distance (m)</div><input class="text-input" type="number" step="1" value="${f.dist1??''}" oninput="App.setP('dist1',App.numv(this.value))"></div>
      <div class="field" style="margin-top:0;"><div class="field-label">Time (sec)</div><input class="text-input" type="number" step="1" value="${f.time1??''}" oninput="App.setP('time1',App.numv(this.value))"></div>
    </div>
    <div class="section-label">Effort 2 (long, 12–20 min)</div>
    <div class="row2">
      <div class="field" style="margin-top:0;"><div class="field-label">Distance (m)</div><input class="text-input" type="number" step="1" value="${f.dist2??''}" oninput="App.setP('dist2',App.numv(this.value))"></div>
      <div class="field" style="margin-top:0;"><div class="field-label">Time (sec)</div><input class="text-input" type="number" step="1" value="${f.time2??''}" oninput="App.setP('time2',App.numv(this.value))"></div>
    </div>`;
  return shell('Critical Pace Test','Lactate Threshold Pace', proc, glossary(['m','sec']), body, result);
}
function screenProtocolRAMP(){
  const f = S.protocolForm;
  const unit = f.rampUnit || 'kmh';
  let result='';
  if(S.protocolCalculated){
    if(f.vComplete!=null && f.incompleteSec!=null){
      const ltMs = Calc.rampTest(f.vComplete, f.incompleteSec, 180);
      result = resultBlock('LT Pace', msToPace(ltMs), Calc.paceZoneTable(ltMs), 'pace');
    } else {
      result = `<div class="field-error" style="margin-top:14px;">Please enter the speed/pace of the last completed stage and the time run in the final stage, then press Calculate again.</div>`;
    }
  }
  const proc = procedure(`
    <p><b>Warm-up:</b> Perform a warm up. For example: 10 minutes easy with some short accelerations.</p>
    <ol>
      <li>Run at 8 km/h.</li>
      <li>Increase velocity 1 km/h every 3 minutes.</li>
      <li>Keep ramping up until you simply cannot continue.</li>
    </ol>
    <p><b>Cool-down:</b> For example, 10 minutes easy.</p>`);
  const speedField = unit==='kmh'
    ? `<div class="field"><div class="field-label">Speed of last fully completed stage (km/h)</div>
        <input class="text-input" type="number" step="0.1" value="${f.vComplete??''}" oninput="App.setRampKmh(this.value)"></div>`
    : `<div class="field"><div class="field-label">Pace of last fully completed stage (min/km)</div>
        <input class="text-input" placeholder="e.g. 7:30" value="${f.vCompletePaceRaw??(f.vComplete?kmhToPaceStr(f.vComplete):'')}" oninput="App.setRampPace(this.value)"></div>`;
  const body = `
    <div class="field"><div class="field-label">Input unit</div>
      <div class="chip-toggle">
        <button class="${unit==='kmh'?'active':''}" onclick="App.setRampUnit('kmh')">km/h</button>
        <button class="${unit==='minkm'?'active':''}" onclick="App.setRampUnit('minkm')">min/km</button>
      </div>
      <div class="field-hint">Switch units any time — the value converts automatically.</div>
    </div>
    ${speedField}
    <div class="field"><div class="field-label">Time run in the final, uncompleted stage (seconds)</div>
      <input class="text-input" type="number" value="${f.incompleteSec??''}" oninput="App.setP('incompleteSec',App.numv(this.value))"></div>`;
  return shell('RAMP Test','Lactate Threshold Pace', proc, glossary(['kmh','minkm','sec']), body, result);
}
function screenProtocol30Pace(){
  const f = S.protocolForm;
  let result='';
  if(S.protocolCalculated){
    if(f.dist30){
      const ltMs = Calc.thirtyMinPace(f.dist30);
      result = resultBlock('LT Pace', msToPace(ltMs), Calc.paceZoneTable(ltMs), 'pace');
    } else {
      result = `<div class="field-error" style="margin-top:14px;">Please enter the distance covered in 30 minutes, then press Calculate again.</div>`;
    }
  }
  const proc = procedure(`
    <p><b>Warm-up:</b> 10 minutes easy with some accelerations.</p>
    <ol>
      <li>30 minutes as fast as you can (max effort at steady pace)</li>
    </ol>
    <p><b>Cool-down:</b> 10 minutes.</p>`);
  const body = `
    <div class="field"><div class="field-label">Distance covered in 30 minutes (meters)</div>
      <input class="text-input" type="number" value="${f.dist30??''}" oninput="App.setP('dist30',App.numv(this.value))"></div>`;
  return shell('30-Minute Run Test','Lactate Threshold Pace', proc, glossary(['ms','min']), body, result);
}
function screenProtocol5KPace(){
  const f = S.protocolForm;
  let result='';
  if(S.protocolCalculated){
    if(f.time5k){
      const ltMs = Calc.fiveKPace(f.time5k);
      result = resultBlock('LT Pace', msToPace(ltMs), Calc.paceZoneTable(ltMs), 'pace');
    } else {
      result = `<div class="field-error" style="margin-top:14px;">Please enter your 5K time (e.g. 22:30), then press Calculate again.</div>`;
    }
  }
  const proc = procedure(`
    <p>Run a 5K time trial or race at genuine maximal, steady effort. The source does not specify a formal warm-up/cool-down for this test — use your usual race-day routine.</p>`);
  const body = `
    <div class="field"><div class="field-label">5K Time (h:mm:ss or mm:ss)</div>
      <input class="text-input" placeholder="e.g. 22:30" value="${f.time5kRaw??''}" oninput="App.setP5kTime(this.value)"></div>`;
  return shell('5K Run Test','Lactate Threshold Pace', proc, glossary(['ms','sec']), body, result);
}
function screenProtocol5KHR(){
  const f = S.protocolForm;
  let result='';
  if(S.protocolCalculated){
    if(f.avgHr5k){
      const lthr = Calc.lthrFiveK(f.avgHr5k);
      result = resultBlock('LTHR', Math.round(lthr)+' bpm', Calc.hrZoneTable(lthr), 'hr');
    } else {
      result = `<div class="field-error" style="margin-top:14px;">Please enter your average HR over the 5K, then press Calculate again.</div>`;
    }
  }
  const proc = procedure(`
    <p>Run a 5K at maximal, steady effort and record your average heart rate for the whole distance (from a watch/HR strap). Formula: Running LTHR = average HR during 5K ÷ 1.04 (Gale Bernhardt, <i>Triathlon: Training Basics</i>). The source does not give a separate formal warm-up/cool-down for this test.</p>`);
  const body = `
    <div class="field"><div class="field-label">Average HR over the 5K (bpm)</div>
      <input class="text-input" type="number" value="${f.avgHr5k??''}" oninput="App.setP('avgHr5k',App.numv(this.value))"></div>`;
  return shell('LTHR — 5K Method','Lactate Threshold Heart Rate', proc, glossary(['bpm']), body, result);
}
function screenProtocol30HR(){
  const f = S.protocolForm;
  let result='';
  if(S.protocolCalculated){
    if(f.avgHr30){
      const lthr = Calc.lthrThirtyMin(f.avgHr30);
      result = resultBlock('LTHR', Math.round(lthr)+' bpm', Calc.hrZoneTable(lthr), 'hr');
    } else {
      result = `<div class="field-error" style="margin-top:14px;">Please enter your average HR for minutes 10–30, then press Calculate again.</div>`;
    }
  }
  const proc = procedure(`
    <p>Run continuously at maximal, steady effort for 30 minutes. Take the average heart rate from the final 20 minutes — for instance, by lapping your watch after the first 10 minutes.</p>`);
  const body = `
    <div class="field"><div class="field-label">Average HR, minutes 10–30 (bpm)</div>
      <input class="text-input" type="number" value="${f.avgHr30??''}" oninput="App.setP('avgHr30',App.numv(this.value))"></div>`;
  return shell('LTHR — 30-Minute Method','Lactate Threshold Heart Rate', proc, glossary(['bpm','min']), body, result);
}

/* ---------------------------------------------------------
   7) Hydration Protocol screen
   --------------------------------------------------------- */
function screenHydrationProtocol(){
  const f = S.hydrationForm;
  const c = computeHydration(f);
  const warns = S.hydrationCalculated ? hydrationWarnings(f, c) : [];

  const howTo = `
    <div class="proc-card">
      <div class="proc-title" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="App.toggleHydrationHowTo()">
        <span>How to Test</span><span>${S.hydrationHowToOpen?'▾':'▸'}</span>
      </div>
      ${S.hydrationHowToOpen? `
      <p><b>Before:</b> Avoid eating or drinking for roughly 2 hours before starting (if practical), and record a baseline body weight in minimal clothing.</p>
      <p><b>During:</b> Track exact fluid intake (mL) consumed during the session, and note urination if it happens before the post-weigh-in.</p>
      <p><b>After:</b> Towel off sweat and remove soaked clothing before the post-exercise weigh-in — weigh as soon as possible after finishing.</p>
      ` : ''}
    </div>`;

  const testFormHtml = `
    <div class="card">
      <div class="section-label" style="margin-top:0;">Sweat Rate Test</div>
      <div class="row2">
        <div class="field" style="margin-top:0;"><div class="field-label">Test Date</div><input class="text-input" type="date" value="${f.testDate}" oninput="App.setHydrationField('testDate',this.value)"></div>
        <div class="field" style="margin-top:0;"><div class="field-label">Sport</div><input class="text-input" value="${f.sport}" oninput="App.setHydrationField('sport',this.value)"></div>
      </div>
      <div class="field"><div class="field-label">Environment / Profile Label (optional)</div>
        <input class="text-input" placeholder="e.g. Hot/Humid, Cool" value="${f.profileLabel}" oninput="App.setHydrationField('profileLabel',this.value)"></div>
      <div class="row2" style="margin-top:12px;">
        <div class="field" style="margin-top:0;"><div class="field-label">Exercise Duration (min)</div><input class="text-input" type="number" value="${f.duration}" oninput="App.setHydrationField('duration',this.value)"></div>
        <div class="field" style="margin-top:0;"><div class="field-label">Exercise Intensity</div>
          <select class="select-input" onchange="App.setHydrationField('intensity',this.value)">
            ${['Easy','Moderate','Hard','Race Pace'].map(o=>`<option ${f.intensity===o?'selected':''}>${o}</option>`).join('')}
          </select></div>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div class="field" style="margin-top:0;"><div class="field-label">Pre-Exercise Weight (kg)</div><input class="text-input" type="number" step="0.01" value="${f.preWeight}" oninput="App.setHydrationField('preWeight',this.value)"></div>
        <div class="field" style="margin-top:0;"><div class="field-label">Post-Exercise Weight (kg)</div><input class="text-input" type="number" step="0.01" value="${f.postWeight}" oninput="App.setHydrationField('postWeight',this.value)"></div>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div class="field" style="margin-top:0;"><div class="field-label">Fluid Consumed (mL)</div><input class="text-input" type="number" value="${f.fluidConsumed}" oninput="App.setHydrationField('fluidConsumed',this.value)"></div>
        <div class="field" style="margin-top:0;"><div class="field-label">Urine Produced (mL, optional)</div><input class="text-input" type="number" value="${f.urine}" oninput="App.setHydrationField('urine',this.value)"></div>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div class="field" style="margin-top:0;"><div class="field-label">Temperature (°C)</div><input class="text-input" type="number" value="${f.temperature}" oninput="App.setHydrationField('temperature',this.value)"></div>
        <div class="field" style="margin-top:0;"><div class="field-label">Relative Humidity (%)</div><input class="text-input" type="number" value="${f.humidity}" oninput="App.setHydrationField('humidity',this.value)"></div>
      </div>
      <div class="field"><div class="field-label">Notes</div>
        <textarea class="textarea-input" rows="2" oninput="App.setHydrationField('notes',this.value)">${f.notes}</textarea></div>
    </div>`;

  const recHtml = `
    <div class="card">
      <div class="section-label" style="margin-top:0;">Hydration Recommendation</div>
      <div class="field"><div class="field-label">Target Replacement % (typically 70–80%)</div>
        <input class="text-input" type="number" min="0" max="150" value="${f.targetPct}" oninput="App.setHydrationField('targetPct',this.value)"></div>
      ${S.hydrationCalculated? `
      <div class="result-card" style="margin-top:14px;">
        <div class="unit">Recommended Starting Target</div>
        <div class="big">${c.fluidTargetMlHr!=null? Math.round(c.fluidTargetMlHr)+' mL/hr' : '—'}</div>
        <div class="field-hint" style="color:#B9B6B1;margin-top:8px;">A starting point, not an absolute requirement — adjust based on how the athlete responds.</div>
      </div>` : ''}
    </div>`;

  const electrolyteHtml = `
    <div class="card">
      <div class="section-label" style="margin-top:0;">Electrolyte &amp; Fueling</div>
      <div class="field"><div class="field-label">Sweat Sodium Concentration (mg/L, optional)</div>
        <input class="text-input" type="number" value="${f.sweatSodiumConc}" oninput="App.setHydrationField('sweatSodiumConc',this.value)"></div>
      ${S.hydrationCalculated && c.sodiumLossMgHr!=null? `<div class="field-hint">Estimated Sodium Loss: <b>${Math.round(c.sodiumLossMgHr)} mg/hr</b> — reference only.</div>` : ''}
      <div class="row2" style="margin-top:12px;">
        <div class="field" style="margin-top:0;"><div class="field-label">Final Sodium Target (mg/hr)</div>
          <input class="text-input" type="number" value="${f.sodiumTargetManual}" oninput="App.setHydrationField('sodiumTargetManual',this.value)"></div>
        <div class="field" style="margin-top:0;"><div class="field-label">Carbohydrate Target (g/hr)</div>
          <input class="text-input" type="number" value="${f.carbTarget}" oninput="App.setHydrationField('carbTarget',this.value)"></div>
      </div>
      <div class="field-hint">Manually prescribe the final Sodium and Carbohydrate targets, using the sodium estimate above only as a reference — the two are tracked separately and never combined.</div>
    </div>`;

  const raceHtml = `
    <div class="card">
      <div class="section-label" style="margin-top:0;">Race-Day Protocol</div>
      <div class="row2">
        <div class="field" style="margin-top:0;"><div class="field-label">Expected Race Duration (hr)</div>
          <input class="text-input" type="number" step="0.1" value="${f.raceDurationHr}" oninput="App.setHydrationField('raceDurationHr',this.value)"></div>
        <div class="field" style="margin-top:0;"><div class="field-label">Bottle / Flask Capacity (mL)</div>
          <input class="text-input" type="number" value="${f.bottleCapacityMl}" oninput="App.setHydrationField('bottleCapacityMl',this.value)"></div>
      </div>
      ${S.hydrationCalculated? `
      <div class="table-wrap" style="margin-top:14px;"><table>
        <thead><tr><th class="rowhead">Target</th><th>Per Hour</th><th>Per 30 min</th><th>Per 15 min</th></tr></thead>
        <tbody>
          <tr><td class="rowhead">Fluid (mL)</td><td>${c.fluidTargetMlHr!=null?Math.round(c.fluidTargetMlHr):'—'}</td><td>${c.fluidTargetMlHr!=null?Math.round(perInterval(c.fluidTargetMlHr,2)):'—'}</td><td>${c.fluidTargetMlHr!=null?Math.round(perInterval(c.fluidTargetMlHr,4)):'—'}</td></tr>
          <tr><td class="rowhead">Sodium (mg)</td><td>${f.sodiumTargetManual!==''?num(f.sodiumTargetManual):'—'}</td><td>${f.sodiumTargetManual!==''?Math.round(perInterval(num(f.sodiumTargetManual),2)):'—'}</td><td>${f.sodiumTargetManual!==''?Math.round(perInterval(num(f.sodiumTargetManual),4)):'—'}</td></tr>
          <tr><td class="rowhead">Carb (g)</td><td>${f.carbTarget!==''?num(f.carbTarget):'—'}</td><td>${f.carbTarget!==''?Math.round(perInterval(num(f.carbTarget),2)*10)/10:'—'}</td><td>${f.carbTarget!==''?Math.round(perInterval(num(f.carbTarget),4)*10)/10:'—'}</td></tr>
        </tbody>
      </table></div>
      ${c.totalFluidMl!=null? `<div class="field-hint" style="margin-top:10px;">Total fluid requirement for the race: <b>${Math.round(c.totalFluidMl)} mL</b> (${(c.totalFluidMl/1000).toFixed(2)} L)${c.bottlesNeeded!=null?` · about ${c.bottlesNeeded} bottle/flask refill(s)`:''}</div>` : ''}
      ` : ''}
    </div>`;

  const warningsHtml = warns.length? `
    <div class="note-card">
      <b>⚠ Points to review</b>
      <ul style="margin:8px 0 0 16px;">${warns.map(w=>`<li style="margin-top:4px;">${w}</li>`).join('')}</ul>
    </div>` : '';

  const errorHtml = S.hydrationError? `<div class="field-error" style="margin-top:10px;">${S.hydrationError}</div>` : '';

  const actions = `
    <div class="detail-bottom">
      <button class="btn-outline" onclick="App.resetHydration()">Reset</button>
      <button class="btn-solid" onclick="App.calcHydration()">Calculate</button>
    </div>
    ${S.hydrationCalculated? `<div class="detail-bottom"><button class="btn-solid" style="flex:1;background:var(--orange);" onclick="App.submitHydrationTest()">Save Test to History</button></div>`:''}`;

  const sortedTests = (S.hydrationTests||[]).slice().sort((a,b)=>b.testDate.localeCompare(a.testDate));
  const historyRows = sortedTests.map(t=>`
    <tr>
      <td class="rowhead">${t.testDate}</td>
      <td>${t.sport||'-'}${t.profileLabel? ` <span class="badge gray">${t.profileLabel}</span>`:''}</td>
      <td>${t.duration!=null?t.duration+' min':'-'}</td>
      <td>${t.temperature!=null?t.temperature+'°C':'-'}</td>
      <td>${t.humidity!=null?t.humidity+'%':'-'}</td>
      <td>${t.sweatRate!=null?Math.round(t.sweatRate)+' mL/hr':'-'}</td>
      <td>${t.weightChangePercent!=null?t.weightChangePercent.toFixed(1)+'%':'-'}</td>
      <td>${t.sodiumTarget!=null?t.sodiumTarget+' mg/hr':'-'}</td>
      <td>
        ${t.isActiveProfile? `<span class="badge">Active</span>` : `<button class="small-btn outline" style="padding:6px 10px;font-size:11px;" onclick="App.setActiveHydrationTest('${t.id}')">Set Active</button>`}
        <button class="del-icon-btn" style="margin-left:6px;" title="Delete test" onclick="App.confirmDeleteHydrationTest('${t.id}')">✕</button>
      </td>
    </tr>`).join('');
  const historyTable = `
    <div class="card">
      <div class="section-label" style="margin-top:0;">Test History<span class="badge gray">${sortedTests.length} tests</span></div>
      ${sortedTests.length? `<div class="table-wrap"><table>
        <thead><tr><th class="rowhead">Date</th><th>Sport</th><th>Duration</th><th>Temp</th><th>Humidity</th><th>Sweat Rate</th><th>Weight Δ</th><th>Sodium</th><th></th></tr></thead>
        <tbody>${historyRows}</tbody>
      </table></div>` : '<div class="field-hint">No hydration tests saved yet — submit one above to see it here (kept in memory only in this standalone module).</div>'}
    </div>`;

  return `
  <div class="brandbar">
    <div class="brand">RUN <span>|</span> CAL</div>
    <div class="nav-tabs">
      ${TABS.map(t=>`<button class="${S.screen===t.id?'active':''}" onclick="App.go('${t.id}')">${t.label}</button>`).join('')}
    </div>
  </div>
  <div class="container">
    <div class="page-head">
      <h1>Hydration Protocol</h1><p>Sweat rate test, hydration &amp; electrolyte targets, and race-day protocol</p>
    </div>
    ${howTo}
    ${testFormHtml}
    ${recHtml}
    ${electrolyteHtml}
    ${raceHtml}
    ${warningsHtml}
    ${errorHtml}
    ${actions}
    ${historyTable}
  </div>${sourceFooter()}`;
}

/* ---------------------------------------------------------
   8) Routing + render
   --------------------------------------------------------- */
const ROUTES = {
  'protocol-cp': screenProtocolCP, 'protocol-ramp': screenProtocolRAMP,
  'protocol-30pace': screenProtocol30Pace, 'protocol-5kpace': screenProtocol5KPace,
  'protocol-5khr': screenProtocol5KHR, 'protocol-30hr': screenProtocol30HR,
  'protocol-hydration': screenHydrationProtocol
};
function render(){
  const fn = ROUTES[S.screen] || screenProtocolCP;
  document.getElementById('app').innerHTML = fn();
}

/* ---------------------------------------------------------
   9) Public API bound to window for inline handlers
   --------------------------------------------------------- */
window.App = {
  numv:(v)=>num(v), timev:(v)=>parseTimeToSec(v),
  go(screen){ S.screen = screen; S.protocolForm={}; S.protocolCalculated=false; render(); },

  // -- LT Pace / LTHR protocols --
  setP(k,v){ S.protocolForm[k]=v; S.protocolCalculated=false; },
  setP5kTime(v){ S.protocolForm.time5kRaw = v; S.protocolForm.time5k = parseTimeToSec(v); S.protocolCalculated=false; },
  setRampUnit(u){ S.protocolForm.rampUnit=u; S.protocolCalculated=false; render(); },
  setRampKmh(v){ S.protocolForm.vComplete = num(v); S.protocolForm.vCompletePaceRaw=''; S.protocolForm.rampUnit='kmh'; S.protocolCalculated=false; },
  setRampPace(v){ S.protocolForm.vCompletePaceRaw = v; S.protocolForm.vComplete = paceStrToKmh(v); S.protocolForm.rampUnit='minkm'; S.protocolCalculated=false; },
  resetProtocol(){ S.protocolForm={}; S.protocolCalculated=false; render(); },
  calcProtocol(){ S.protocolCalculated=true; render(); },

  // -- Hydration Protocol --
  toggleHydrationHowTo(){ S.hydrationHowToOpen = !S.hydrationHowToOpen; render(); },
  setHydrationField(k,v){
    S.hydrationForm[k]=v;
    if(!['sodiumTargetManual','carbTarget','notes','profileLabel'].includes(k)) S.hydrationCalculated=false;
  },
  resetHydration(){ S.hydrationForm = newHydrationForm(); S.hydrationCalculated=false; S.hydrationError=''; render(); },
  calcHydration(){
    const f = S.hydrationForm;
    if(!f.testDate || !f.duration || f.preWeight==='' || f.postWeight===''){
      S.hydrationError = 'Please fill in Test Date, Duration, Pre-Exercise Weight, and Post-Exercise Weight before calculating.';
      S.hydrationCalculated = false;
      render();
      return;
    }
    S.hydrationError = '';
    S.hydrationCalculated = true;
    render();
  },
  submitHydrationTest(){
    if(!S.hydrationCalculated){ S.hydrationError='Please click Calculate before saving.'; render(); return; }
    const f = S.hydrationForm, c = computeHydration(f);
    saveHydrationTestLocal(f, c);
    S.hydrationForm = newHydrationForm(); S.hydrationCalculated=false; S.hydrationError='';
    render();
  },
  setActiveHydrationTest(id){
    S.hydrationTests.forEach(t=>t.isActiveProfile = (t.id===id));
    render();
  },
  confirmDeleteHydrationTest(id){
    if(!confirm('Delete this hydration test?')) return;
    S.hydrationTests = S.hydrationTests.filter(t=>t.id!==id);
    render();
  }
};

render();
</script>
