services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: run
      POSTGRES_PASSWORD: run
      POSTGRES_DB: run_analytics
    ports: ["5432:5432"]
    volumes:
      - run_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U run -d run_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  run_data:

